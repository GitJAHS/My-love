<style>

:root{--glass:rgba(255,255,255,.26);--gb:rgba(255,255,255,.55);--sheet:rgba(255,255,255,.42);--fill:rgba(255,255,255,.3)}

[[.2,.3,"#ff5d9e"],[.8,.25,"#7a6cff"],[.5,.9,"#ffb347"]].forEach((o,i)=>{const r=260+k*90+Math.sin(t+i)*30,rg=c.createRadialGradient(W*o[0],H*o[1],0,W*o[0],H*o[1],r);rg.addColorStop(0,o[2]+"88");rg.addColorStop(1,o[2]+"00");c.fillStyle=rg;c.fillRect(0,0,W,H)});
ps.forEach(p=>{p.y-=p.s*(.3+cur*1.4);p.x+=Math.sin(t+p.h*9)*.4;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}c.fillStyle=`hsla(${330+p.h*60},100%,85%,${.25+k*.4})`;c.beginPath();c.arc(p.x,p.y,p.r*(1+k*.6),0,6.283);c.fill()});
const cx=W/2,cy=H*.46,R=95+k*26;c.save();c.translate(cx,cy);c.rotate(t*.18);c.lineCap="round";c.lineWidth=7;
for(let i=0;i<N;i++){const a=i/N*6.283,l=6+cur*(18+78*wv(i,t))+k*34;c.strokeStyle=`hsl(${320+i/N*70},95%,${68+k*12}%)`;c.beginPath();c.moveTo(Math.cos(a)*R,Math.sin(a)*R);c.lineTo(Math.cos(a)*(R+l),Math.sin(a)*(R+l));c.stroke()}c.restore();
c.shadowColor="#ff7eb3";c.shadowBlur=30+k*40;c.fillStyle="#fff";c.font=`${70+k*22}px -apple-system,Arial,sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText("♡",cx,cy);c.shadowBlur=0;

})(performance.now())}
